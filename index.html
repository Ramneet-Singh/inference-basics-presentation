const stage=document.getElementById('stage');
function syncDOM(oldNode,newNode){
 if(oldNode.nodeType===3){if(oldNode.textContent!==newNode.textContent)oldNode.textContent=newNode.textContent;return}
 if(oldNode.nodeType!==1)return;
 for(const a of [...oldNode.attributes])if(!newNode.hasAttribute(a.name))oldNode.removeAttribute(a.name);
 for(const a of [...newNode.attributes])if(oldNode.getAttribute(a.name)!==a.value)oldNode.setAttribute(a.name,a.value);
 for(let i=0;i<newNode.childNodes.length;i++){
  const n=newNode.childNodes[i],o=oldNode.childNodes[i];
  if(!o)oldNode.appendChild(n.cloneNode(true));
  else if(o.nodeType!==n.nodeType||o.nodeName!==n.nodeName)oldNode.replaceChild(n.cloneNode(true),o);
  else syncDOM(o,n);
 }
 while(oldNode.childNodes.length>newNode.childNodes.length)oldNode.lastChild.remove();
}
function render(preserve=false){
 const s=slides[state.slide];stage.classList.toggle('cover',!!s.cover);const markup=`<h1 class="slide-title">${s.title}</h1>${s.render()}`;
 if(preserve){const draft=stage.cloneNode(false);draft.innerHTML=markup;syncDOM(stage,draft)}else stage.innerHTML=markup;
 document.title=`${state.slide+1}. ${s.title} · Proximal`;
 document.getElementById('counter').textContent=`${String(state.slide+1).padStart(2,'0')} / ${slides.length}`;
 document.getElementById('progress').style.width=`${(state.slide+1)/slides.length*100}%`;
 document.getElementById('prev').disabled=state.slide===0;document.getElementById('next').disabled=state.slide===slides.length-1;
 history.replaceState(null,'','#'+(state.slide+1));bindSlide();
}
function go(i){state.slide=Math.max(0,Math.min(slides.length-1,i));render()}
function rerenderControl(id,update){const el=document.getElementById(id);if(!el)return;el[el.type==='range'?'oninput':'onchange']=()=>{const value=el.value;update(value);render(true)}}
function bindSlide(){
 stage.querySelectorAll('[data-hw]').forEach(el=>{const act=()=>{state.hw=Number(el.dataset.hw);render()};el.onclick=act;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();act()}}});
 stage.querySelectorAll('[data-build]').forEach(el=>el.onclick=()=>{const key=el.dataset.build,max=Number(el.dataset.max);if(el.dataset.advance==='true'&&state[key]>=max){go(state.slide+1);return}state[key]=(state[key]+1)%(max+1);render()});
 rerenderControl('intensity',v=>state.intensity=10**(Number(v)/100));rerenderControl('reuse',v=>state.reuse=2**Number(v));
 rerenderControl('kv-context',v=>state.kvContext=2**Number(v));rerenderControl('kv-heads',v=>state.kvHeads=Number(v));
 rerenderControl('budget-hw',v=>state.hw=Number(v));rerenderControl('context',v=>state.context=2**Number(v));
 rerenderControl('batch',v=>state.batch=2**Number(v));rerenderControl('batch-context',v=>state.batchContext=Number(v));
}
function scale(){const box=document.getElementById('viewport').getBoundingClientRect();stage.style.transform=`scale(${Math.min(box.width/1440,box.height/810)})`}
function build(){const s=slides[state.slide];if(s.build&&state[s.build]<s.maxBuild){state[s.build]++;render()}else go(state.slide+1)}
let previousFocus=null;
function closeDialog(){document.getElementById('dialog').hidden=true;state.dialog=null;if(previousFocus)previousFocus.focus({preventScroll:true})}
function openDialog(){previousFocus=document.activeElement;state.dialog='sources';const title=document.getElementById('dialog-title'),body=document.getElementById('dialog-content');
 title.textContent='Sources & assumptions';body.innerHTML=`<p>Based on the three supplied resources, with hardware figures checked against vendor documentation.</p><div class="source-links">${Object.values(sources).map(([t,u])=>`<a href="${u}" target="_blank" rel="noopener">${t} ↗</a>`).join('')}</div><div class="source-heading" style="margin-top:44px">Accounting conventions</div><p>The example model uses BF16 storage and math. The hardware comparison labels each datatype. Arithmetic intensity and machine balance are measured in FLOP/byte. One multiply-add = two FLOPs. Decimal GB/TB for bandwidth and weight traffic, binary KiB/GiB for KV capacity. Hardware numbers are theoretical ceilings. The CPU comparison uses ordinary AVX-512 FP32 arithmetic at base clock. GPU comparisons use dense BF16 matrix arithmetic. B200 uses NVIDIA HGX/DGX peak specifications.</p><p>Example model: L=32, d=4096, f=11008, query heads=32, KV heads=8, head width=128, vocab=32000, tied embedding/output matrix. Norm and elementwise costs are omitted. Estimators show lower bounds and exclude launch, communication, and workspace costs.</p>`;
 document.getElementById('dialog').hidden=false;document.getElementById('close-dialog').focus();
}
function toast(text){const t=document.getElementById('toast');t.textContent=text;t.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.hidden=true,3000)}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){toast('Use your browser’s full-screen command.')}}
document.getElementById('prev').onclick=()=>go(state.slide-1);document.getElementById('next').onclick=()=>go(state.slide+1);
document.getElementById('close-dialog').onclick=closeDialog;
document.getElementById('dialog').onclick=e=>{if(e.target.id==='dialog')closeDialog()};
window.addEventListener('keydown',e=>{
 if(state.dialog){if(e.key==='Escape'){e.preventDefault();closeDialog()}else if(e.key==='Tab'){const els=[...document.getElementById('dialog').querySelectorAll('button,a[href]')];if(e.shiftKey&&document.activeElement===els[0]){e.preventDefault();els.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===els.at(-1)){e.preventDefault();els[0].focus()}}return}
 if(/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName))return;
 if(/^(BUTTON|A)$/.test(e.target.tagName)&&(e.key===' '||e.key==='Enter'))return;
 switch(e.key){case'ArrowRight':case'PageDown':e.preventDefault();go(state.slide+1);break;case'ArrowLeft':case'PageUp':e.preventDefault();go(state.slide-1);break;case' ':e.preventDefault();build();break;case'Home':e.preventDefault();go(0);break;case'End':e.preventDefault();go(slides.length-1);break;case's':case'S':openDialog();break;case'f':case'F':fullscreen();break;case'b':case'B':document.body.classList.toggle('blanked');break;case'Escape':document.body.classList.remove('blanked');break;}
});
window.addEventListener('resize',scale);window.addEventListener('hashchange',()=>{const n=Number(location.hash.slice(1));if(Number.isInteger(n)&&n>=1&&n<=slides.length){state.slide=n-1;render()}});
window.addEventListener('beforeprint',()=>{document.querySelectorAll('.print-slide').forEach(e=>e.remove());const saved={...state};slides.forEach((s,i)=>{const el=document.createElement('section');el.className='print-slide'+(s.cover?' cover':'');if(s.build)state[s.build]=s.maxBuild;el.innerHTML=`<h1 class="slide-title">${s.title}</h1>${s.render()}`;document.body.append(el)});Object.assign(state,saved)});
window.addEventListener('afterprint',()=>document.querySelectorAll('.print-slide').forEach(e=>e.remove()));
// Read-only inspection aid for repeatable QA.
window.deck={state,slides,hardware,model:{...M,P,coreParams,kvPerToken,weightBytes},go,render,roofPlot};
render();scale();
</script>
</body>
</html>
